<div class="sticky-section left-sticky-section" id="tool-section">
  <div class="sticky-section-wrap">
    <div class="vertical-centerer">
      <div class="brush-size-selector" role="group" aria-label="Brush size">
        <button type="button" class="brush-size" data-size="1" aria-pressed="true" aria-label="Brush size 1 px" title="1 px"></button>
        <button type="button" class="brush-size" data-size="2" aria-pressed="false" aria-label="Brush size 2 px" title="2 px"></button>
        <button type="button" class="brush-size" data-size="3" aria-pressed="false" aria-label="Brush size 3 px" title="3 px"></button>
        <button type="button" class="brush-size" data-size="4" aria-pressed="false" aria-label="Brush size 4 px" title="4 px"></button>
      </div>
      <ul id="tools-container" class="tools-wrapper"></ul>
      <div class="palette-wrapper">
        <div
          class="tool-icon tool-color-picker"
          title="Primary - left mouse button"
          rel="tooltip"
          data-placement="right"
        >
          <input id="color-picker" class="color" type="text"/>
        </div>
        <div
          class="tool-icon tool-color-picker"
          title="Secondary - right mouse button"
          rel="tooltip"
          data-placement="right"
        >
          <input id="secondary-color-picker" class="secondary-color-picker color" type="text" />
        </div>
        <div
          class="swap-colors-icon"
          title="Swap colors (X)"
          rel="tooltip"
          data-placement="right"
        ></div>
      </div>
    </div>
  </div>

  <!-- Templates -->

  <!-- Drawing tool icon-button -->
  <script type="text/template" id="drawingTool-item-template">
    <li rel="tooltip" data-placement="{{tooltipposition}}" class="{{cssclass}}" data-tool-id="{{toolid}}" title="{{title}}"></li>
  </script>

  <!-- Drawing tool tooltip container -->
  <script type="text/template" id="drawingTool-tooltipContainer-template">
    <div class='tools-tooltip-container'>
      <div>{{helptext}} <span class='tools-tooltip-shortcut'>{{shortcut}}</span></div>
      {{descriptors}}
    </div>
  </script>

  <!-- Drawing tool tooltip line for modifier -->
  <script type="text/template" id="drawingTool-tooltipDescriptor-template">
    <div class='tools-tooltip-descriptor'>
      <span class='tools-tooltip-descriptor-button'>{{key}}</span>
      {{description}}
    </div>
  </script>

  <!-- Drawing tool tooltip line -->
  <script type="text/template" id="drawingTool-simpleTooltipDescriptor-template">
    <div class='tools-tooltip-descriptor'>
      {{description}}
    </div>
  </script>
</div>
